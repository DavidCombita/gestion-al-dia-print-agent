appId: co.aldia.printagent
productName: Gestion al Dia Print Agent
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/printer/**/*
extraResources:
  - from: build
    to: build
    filter:
      - icon.ico
      - tray-icon.png
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: Gestion-al-Dia-Print-Agent-${version}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
