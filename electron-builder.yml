appId: co.aldia.printagent
productName: Gestion al Dia Print Agent
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
electronUpdaterCompatibility: '>=2.16'
extraResources:
  - from: build
    to: build
    filter:
      - icon.ico
      - tray-icon.png
  - from: node_modules/printer
    to: printer-runtime
    filter:
      - package.json
      - lib/node_printer.node
      - build/Release/node_printer.node
afterPack: scripts/verify-packaged-printer.js
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: Gestion-al-Dia-Print-Agent-${version}-Setup.${ext}
publish:
  - provider: github
    owner: DavidCombita
    repo: gestion-al-dia-print-agent
    releaseType: release
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
