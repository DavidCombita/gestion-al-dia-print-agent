name: Release Print Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Resolve release metadata
        id: release_meta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = pkg.version;
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : `v${version}`;

            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.info(`Version detectada: ${version}`);
            core.info(`Tag objetivo: ${tag}`);

      - name: Ensure release tag is unused
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ steps.release_meta.outputs.tag }}`;

            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              core.setFailed(
                `Ya existe una release para ${tag}. Con releases inmutables no se reutilizan tags; sube una nueva version.`,
              );
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existe una release previa para ${tag}; continuando.`);
                return;
              }

              throw error;
            }

      - name: Build Windows release artifacts
        run: npm run release:win

      - name: Publish immutable release with assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"

          gh release create "$TAG" \
            release/*.exe \
            release/*.blockmap \
            release/latest*.yml \
            --target "${GITHUB_SHA}" \
            --title "$TAG" \
            --generate-notes
