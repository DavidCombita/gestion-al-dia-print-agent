name: Release Print Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Resolve release metadata
        id: release_meta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = pkg.version;
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : `v${version}`;

            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.info(`Version detectada: ${version}`);
            core.info(`Tag objetivo: ${tag}`);

      - name: Validate release tag state
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ steps.release_meta.outputs.tag }}`;

            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              if (!data.draft) {
                core.setFailed(
                  `Ya existe una release publicada para ${tag}. Elimina esa release o usa una nueva version antes de volver a ejecutar el workflow.`,
                );
                return;
              }

              core.info(`Se encontro un draft existente para ${tag}; se reutilizara en esta ejecucion.`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existe una release previa para ${tag}; continuando con la publicacion.`);
                return;
              }

              throw error;
            }

      - name: Build Windows release artifacts
        run: npm run release:win

      - name: Publish draft release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          fail_on_unmatched_files: true
          append_body: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
